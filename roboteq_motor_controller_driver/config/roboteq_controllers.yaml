controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    
    roboteq_broadcaster:
      type: roboteq_broadcaster/RoboteqBroadcaster


roboteq_broadcaster:
  ros__parameters:
    # TODO: set to the name attribute of the Roboteq <ros2_control name="..."> tag in the URDF
    hardware_name: ""


diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.561
    wheels_per_side: 1
    wheel_radius: 0.07

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    position_feedback: false
    enable_odom_tf: false

    cmd_vel_timeout: 0.5
    publish_limited_velocity: false
    use_stamped_vel: false
    velocity_rolling_window_size: 10

    # Velocity, acceleration and jerk limits
    # A limit is active whenever it is set (not NaN), there are no has_*_limits switches anymore.
    # Leave a limit out to disable it. Whenever a min_* is unspecified, it defaults to -max_*
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0

    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0
