/**:
  ros__parameters:
    serial:
      port: /dev/ttyROBOTEQ
      baud: 115200
      timeout_ms: 10 # time to wait for the queries responses in each read cycle

    encoder:
      cpr: 10000 # with quadrature

    # operating_modes: # ^MMOD sent on controller switch. Defaults: position 3, velocity 1, effort 5
    
    queries_list: ["CR", "S", "A", "FS", "FF", "FM"]

    queries:
      CR:
        name: "encoder_count_relative"
        size: 2
      S:
        name: "encoder_motor_speed"
        size: 2
      A:
        name: "motor_amps"
        size: 2
      FF:
        name: "fault_flag"
        size: 1
      FS:
        name: "status_flag"
        size: 1
      FM:
        name: "runtime_status_flag"
        size: 1