roboteq_motor_controller_driver:
  serial:
    port: {
      type: string,
      read_only: true,
    }
    baud: {
      type: int,
      read_only: true,
    }
    timeout_ms: {
      type: int,
      default_value: 10,
      read_only: true,
      description: "Time to wait for the responses to the queries in each read cycle",
      validation: {
        gt<>: [0],
      }
    }

  encoder:
    cpr: {
      type: int,
      read_only: true,
      validation: {
        gt<>: [0],
      }
    }

  effort:
    amps_limit: {
      type: double,
      read_only: true,
      description: "Amps Limit configured in the controller. An effort command of amps_limit maps to !G 1000",
      validation: {
        gt<>: [0.0],
      }
    }

  operating_modes:
    position: {
      type: int,
      default_value: 3,
      read_only: true,
      description: "Operating mode (^MMOD) used for position control. 3 = closed-loop count position",
      validation: {
        bounds<>: [0, 6],
      }
    }
    velocity: {
      type: int,
      default_value: 1,
      read_only: true,
      description: "Operating mode (^MMOD) used for velocity control. 1 = closed-loop speed",
      validation: {
        bounds<>: [0, 6],
      }
    }
    effort: {
      type: int,
      default_value: 5,
      read_only: true,
      description: "Operating mode (^MMOD) used for effort control. 5 = torque",
      validation: {
        bounds<>: [0, 6],
      }
    }

  queries_list: {
    type: string_array,
    read_only: true,
    validation: {
      unique<>: [],
      subset_of<>: [["A","AI","AIC","ANG","ASI","B","BA","BCR","BRK","BMC","BMF",
        "BMS","BS","BSC","BSR","C","CAN","CB","CD","CEC","CF","CHS","CIA","CIG",
        "CIP","CIS","CL","CPG","CR","CSR","CSS","D","DI","DDT","DG","DO","DPA",
        "DR","E","F","FC","FLW","FF","FID","FIN","FM","FS","HS","ICL","IG","LK",
        "M","MA","MCB","MCU","MGD","MGM","MGS","MGT","MGY","MGX","P","PG","PHA",
        "PI","PIC","S","SCC","SEC","SDT","SNA","SR","SS","SSR","STT","T","TM",
        "TR","TRN","UID","V","VAR"]]
    }
  }

  queries:
    __map_queries_list:
      name: {
        type: string,
        read_only: true,
        validation: {
          not_empty<>: [],
        }
      }
      size: {
        type: int,
        read_only: true,
        validation: {
          gt<>: [0],
        }
      }
