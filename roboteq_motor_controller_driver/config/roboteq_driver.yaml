/**:
  ros__parameters:
    serial:
      port: /dev/ttyS1
      baud: 115200
      timeout_ms: 10 # time to wait for the queries responses in each read cycle

    encoder:
      cpr: 10000 # with quadrature

    # operating_modes: # ^MMOD sent on controller switch. Defaults: position 3, velocity 1, effort 5

    # Settings checked at configure and set when they differ, in raw Roboteq units (as returned by ~X).
    # One value for global settings, one per channel otherwise. MMOD and ECHOF are managed by the driver.
    # configuration_list: ["ALIM", "MXRPM", "RWD"]
    # configuration:
    #   ALIM:
    #     values: [600, 600] # 60.0 A per channel
    #   MXRPM:
    #     values: [3000, 3000]
    #   RWD:
    #     values: [1000] # serial watchdog ms
    # configuration_save_to_eeprom: false
    
    queries_list: ["CR", "S", "A", "FS", "FF", "FM"]

    # Optional per query "rate" [Hz]: 0 (default) = every read cycle. The position, velocity and effort queries must stay at 0
    queries:
      CR:
        name: "encoder_count_relative"
        size: 2
      S:
        name: "encoder_motor_speed"
        size: 2
      A:
        name: "motor_amps"
        size: 2
      FF:
        name: "fault_flag"
        size: 1
        rate: 1.0
      FS:
        name: "status_flag"
        size: 1
        rate: 1.0
      FM:
        name: "runtime_status_flag"
        size: 1
        rate: 1.0